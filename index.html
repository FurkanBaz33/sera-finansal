<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muz Serası Günlük Giriş</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 13px;
            margin: 20px;
            background-color: #ffffff;
            color: #333;
        }
        h2 {
            margin-top: 0;
            font-size: 18px;
            border-bottom: 2px solid #ccc;
            padding-bottom: 5px;
        }
        .top-bar {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        .top-bar input, .top-bar select, .top-bar button {
            padding: 4px 6px;
            font-size: 12px;
            border: 1px solid #999;
        }
        .top-bar button {
            cursor: pointer;
            background-color: #f0f0f0;
        }
        .top-bar button:hover {
            background-color: #e0e0e0;
        }
        .container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        .main-content {
            flex: 1;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #999;
            padding: 6px;
            text-align: left;
        }
        th {
            background-color: #f5f5f5;
            font-weight: bold;
            text-align: center;
        }
        td {
            text-align: center;
        }
        .summary-panel {
            width: 280px;
            background-color: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 15px;
        }
        .summary-panel h3 {
            margin-top: 0;
            font-size: 15px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
        }
        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            margin-bottom: 15px;
        }
        .filter-buttons button {
            padding: 3px 6px;
            font-size: 11px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #fff;
        }
        .filter-buttons button.active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }
        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            border-bottom: 1px dotted #ccc;
            padding-bottom: 4px;
        }
        .summary-item.bold {
            font-weight: bold;
            font-size: 14px;
            border-bottom: none;
            margin-top: 10px;
        }
        .tur-ozetleri {
            margin-top: 20px;
        }
        .tur-ozetleri h4 {
            margin: 0 0 10px 0;
            font-size: 13px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 3px;
        }
        .action-btn {
            font-size: 11px;
            padding: 2px 6px;
            cursor: pointer;
            display: block;
            margin: 2px auto;
            width: 60px;
            border: 1px solid #999;
            background-color: #f0f0f0;
        }
        .action-btn:hover {
            background-color: #ddd;
        }
        .text-green { color: #008000; font-weight: bold; }
        .text-red { color: #cc0000; }
        
        /* Table Filters */
        .table-filters {
            margin-bottom: 10px;
        }
        .table-filters button {
            padding: 3px 10px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #eee;
        }
        .table-filters button.active {
            background: #ddd;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Muz Serası Günlük Giriş</h2>
    
    <div class="top-bar">
        <input type="date" id="tarih">
        <select id="islem_tipi" onchange="updateTurler()">
            <option value="Gelir">Gelir</option>
            <option value="Gider">Gider</option>
        </select>
        <select id="tur">
            <!-- Dinamik dolacak -->
        </select>
        <input type="text" id="aciklama" placeholder="Açıklama / Not (Örn: İşçilik, İlaç vs.)" style="width: 250px;">
        <input type="number" id="tutar" placeholder="Tutar (₺)" step="0.01" style="width: 100px;">
        <button onclick="kaydet()">Kaydet</button>
    </div>

    <div class="container">
        <div class="main-content">
            <div class="table-filters">
                <strong>Kayıtlar: </strong>
                <button id="btn_hepsi" class="active" onclick="setTableFilter('Hepsi')">Tümü</button>
                <button id="btn_gelir" onclick="setTableFilter('Gelir')">Sadece Gelirler</button>
                <button id="btn_gider" onclick="setTableFilter('Gider')">Sadece Giderler</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Tarih</th>
                        <th>İşlem Tipi</th>
                        <th>Tür</th>
                        <th>Açıklama</th>
                        <th>Tutar (₺)</th>
                        <th>İşlem</th>
                    </tr>
                </thead>
                <tbody id="kayit_govdesi">
                    <!-- Kayıtlar buraya JS ile gelecek -->
                </tbody>
            </table>
        </div>

        <div class="summary-panel">
            <h3>Özet</h3>
            <div class="filter-buttons">
                <button class="active">Tümü</button>
                <button>Günlük</button>
                <button>Haftalık</button>
                <button>Aylık</button>
                <button>Yıllık</button>
                <button>Özel Aralık</button>
            </div>
            
            <div class="summary-item">
                <span>Toplam Gelir</span>
                <span id="toplam_gelir" class="text-green">0.00 ₺</span>
            </div>
            <div class="summary-item">
                <span>Toplam Gider</span>
                <span id="toplam_gider" class="text-red">0.00 ₺</span>
            </div>
            <div class="summary-item bold" id="kalan_container">
                <span>Kalan (Net)</span>
                <span id="kalan">0.00 ₺</span>
            </div>

            <div class="tur-ozetleri">
                <h4>Kalemlere Göre Toplamlar</h4>
                <div id="kalem_detaylari"></div>
            </div>
        </div>
    </div>

    <script>
        let kayitlar = JSON.parse(localStorage.getItem('muz_sera_kayitlar')) || [];
        let editIndex = -1;
        let currentFilter = 'Hepsi';

        const gelirTurleri = ["Muz Satışı", "Devlet Desteği", "Fide Satışı", "Diğer Gelir"];
        const giderTurleri = ["İşçilik / Yevmiye", "Gübre", "İlaç", "Sulama / Su", "Elektrik", "Fide Alımı", "Bakım / Onarım", "Nakliye", "Diğer Gider"];

        function init() {
            document.getElementById('tarih').valueAsDate = new Date();
            updateTurler();
            render();
        }

        function updateTurler() {
            const islem = document.getElementById('islem_tipi').value;
            const turSelect = document.getElementById('tur');
            turSelect.innerHTML = '';
            const turler = islem === 'Gelir' ? gelirTurleri : giderTurleri;
            turler.forEach(t => {
                let opt = document.createElement('option');
                opt.value = t;
                opt.innerText = t;
                turSelect.appendChild(opt);
            });
        }

        function setTableFilter(filter) {
            currentFilter = filter;
            document.getElementById('btn_hepsi').className = filter === 'Hepsi' ? 'active' : '';
            document.getElementById('btn_gelir').className = filter === 'Gelir' ? 'active' : '';
            document.getElementById('btn_gider').className = filter === 'Gider' ? 'active' : '';
            render();
        }

        function kaydet() {
            const tarih = document.getElementById('tarih').value;
            const islem = document.getElementById('islem_tipi').value;
            const tur = document.getElementById('tur').value;
            const aciklama = document.getElementById('aciklama').value;
            const tutar = parseFloat(document.getElementById('tutar').value);

            if(!tarih || isNaN(tutar) || tutar <= 0) {
                alert("Lütfen geçerli bir tarih ve tutar giriniz.");
                return;
            }

            const kayit = { tarih, islem, tur, aciklama, tutar };

            if(editIndex > -1) {
                kayitlar[editIndex] = kayit;
                editIndex = -1;
            } else {
                kayitlar.push(kayit);
            }

            localStorage.setItem('muz_sera_kayitlar', JSON.stringify(kayitlar));
            document.getElementById('aciklama').value = '';
            document.getElementById('tutar').value = '';
            render();
        }

        function sil(index) {
            if(confirm("Bu kaydı silmek istediğinize emin misiniz?")) {
                kayitlar.splice(index, 1);
                localStorage.setItem('muz_sera_kayitlar', JSON.stringify(kayitlar));
                render();
            }
        }

        function duzenle(index) {
            const k = kayitlar[index];
            document.getElementById('tarih').value = k.tarih;
            document.getElementById('islem_tipi').value = k.islem;
            updateTurler();
            document.getElementById('tur').value = k.tur;
            document.getElementById('aciklama').value = k.aciklama;
            document.getElementById('tutar').value = k.tutar;
            editIndex = index;
        }

        function formatMoney(amount) {
            return amount.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function render() {
            const tbody = document.getElementById('kayit_govdesi');
            tbody.innerHTML = '';
            
            let toplamGelir = 0;
            let toplamGider = 0;
            let turOzetleri = {};

            // Orijinal indeksleri kaybetmemek için map kullanıyoruz
            let gosterilecekler = kayitlar.map((k, i) => ({...k, originalIndex: i}));
            
            // Filtreleme
            if(currentFilter !== 'Hepsi') {
                gosterilecekler = gosterilecekler.filter(k => k.islem === currentFilter);
            }

            // Tarihe göre yeniden eskiye sırala
            gosterilecekler.sort((a,b) => new Date(b.tarih) - new Date(a.tarih));

            gosterilecekler.forEach(k => {
                let tr = document.createElement('tr');
                let islemColor = k.islem === 'Gelir' ? 'color: green;' : 'color: red;';
                tr.innerHTML = `
                    <td>${k.tarih}</td>
                    <td style="${islemColor} font-weight:bold;">${k.islem}</td>
                    <td>${k.tur}</td>
                    <td>${k.aciklama}</td>
                    <td>${formatMoney(k.tutar)} ₺</td>
                    <td>
                        <button class="action-btn" onclick="duzenle(${k.originalIndex})">Düzenle</button>
                        <button class="action-btn" onclick="sil(${k.originalIndex})">Sil</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // Özet hesaplamaları tüm kayıtlardan (filtresiz) yapılır
            kayitlar.forEach(k => {
                if(k.islem === 'Gelir') toplamGelir += k.tutar;
                else toplamGider += k.tutar;

                if(!turOzetleri[k.tur]) turOzetleri[k.tur] = 0;
                turOzetleri[k.tur] += k.tutar;
            });

            document.getElementById('toplam_gelir').innerText = formatMoney(toplamGelir) + ' ₺';
            document.getElementById('toplam_gider').innerText = formatMoney(toplamGider) + ' ₺';
            
            const kalan = toplamGelir - toplamGider;
            const kalanEl = document.getElementById('kalan');
            kalanEl.innerText = formatMoney(kalan) + ' ₺';
            
            if(kalan > 0) {
                kalanEl.className = 'text-green';
            } else if (kalan < 0) {
                kalanEl.className = 'text-red';
            } else {
                kalanEl.className = '';
                kalanEl.style.color = '#333';
            }

            const kalemDetaylari = document.getElementById('kalem_detaylari');
            kalemDetaylari.innerHTML = '';
            
            // Türleri Gidere/Gelire göre sıralı gösterebiliriz ama hepsi bir arada da yeterli
            // Büyükten küçüğe sıralayalım
            let sortedTurler = Object.keys(turOzetleri).sort((a,b) => turOzetleri[b] - turOzetleri[a]);
            
            sortedTurler.forEach(t => {
                let div = document.createElement('div');
                div.className = 'summary-item';
                div.innerHTML = `<span>${t}</span> <strong>${formatMoney(turOzetleri[t])} ₺</strong>`;
                kalemDetaylari.appendChild(div);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
